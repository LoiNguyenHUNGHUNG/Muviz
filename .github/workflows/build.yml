name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android_app:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout bandwidth checker
        uses: actions/checkout@v5
        with:
          repository: LoiNguyenHUNGHUNG/bandwidth-timeout-checker
          ref: codex/configure-analysis-entry-points
          path: bandwidth-timeout-checker

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradle executable
        run: chmod +x ./gradlew

      - name: Get local.properties from secrets
        run: echo "${{secrets.LOCAL_PROPERTIES }}" > $GITHUB_WORKSPACE/local.properties

      - name: Build app
        run: >-
          ./gradlew assembleDebug --stacktrace
          -PbandwidthCheckerPath=$GITHUB_WORKSPACE/bandwidth-timeout-checker
          -PkotlinVersion=2.2.20
